<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SyncChat</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family: system-ui, -apple-system, sans-serif; }
body { background: linear-gradient(135deg, #0a1628, #1e3a8a, #1e40af); min-height: 100vh; display: flex; justify-content: center; align-items: center; color: #fff; }
.app { width: 100%; max-width: 420px; height: 100vh; max-height: 880px; background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(28px); border: 1px solid rgba(96, 165, 250, 0.25); border-radius: 28px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
.header { background: rgba(30, 64, 175, 0.35); backdrop-filter: blur(16px); padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(96, 165, 250, 0.2); }
.header h1 { font-size: 22px; font-weight: 700; color: #60a5fa; }
.screen { flex: 1; display: none; flex-direction: column; overflow: hidden; }
.screen.active { display: flex; }
.search-bar { margin: 12px 16px; padding: 12px 16px; background: rgba(255,255,255,0.08); border: 1px solid rgba(96, 165, 250, 0.2); border-radius: 24px; color: rgba(255,255,255,0.6); font-size: 14px; }
.filters { display: flex; gap: 8px; padding: 0 16px 12px; overflow-x: auto; }
.filter { padding: 8px 16px; background: rgba(255,255,255,0.08); border: 1px solid rgba(96, 165, 250, 0.2); border-radius: 20px; font-size: 13px; white-space: nowrap; cursor: pointer; }
.filter.active { background: rgba(59, 130, 246, 0.4); border-color: #3b82f6; }
.chats { flex: 1; overflow-y: auto; }
.chat-item { display: flex; align-items: center; padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; }
.chat-item:hover { background: rgba(255,255,255,0.05); }
.avatar { width: 50px; height: 50px; border-radius: 50%; background: linear-gradient(135deg, #3b82f6, #1d4ed8); display: flex; align-items: center; justify-content: center; font-weight: 600; margin-right: 14px; position: relative; overflow: hidden; flex-shrink: 0; }
.online-dot { position: absolute; bottom: 2px; right: 2px; width: 12px; height: 12px; background: #22c55e; border-radius: 50%; border: 2px solid #0f172a; }
.chat-info { flex: 1; min-width: 0; }
.chat-info h3 { font-size: 16px; font-weight: 600; }
.chat-info p { font-size: 13px; color: rgba(255,255,255,0.6); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.time { font-size: 12px; color: rgba(255,255,255,0.5); }
.bottom-nav { display: none; background: rgba(15, 23, 42, 0.9); border-top: 1px solid rgba(96, 165, 250, 0.15); padding: 6px 0 8px; }
.nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: rgba(255,255,255,0.5); font-size: 11px; cursor: pointer; }
.nav-item.active { color: #60a5fa; }
.nav-item svg { width: 24px; height: 24px; }
.fab { position: fixed; bottom: 80px; right: 20px; width: 56px; height: 56px; background: linear-gradient(135deg, #3b82f6, #1d4ed8); border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 28px; color: white; cursor: pointer; box-shadow: 0 6px 20px rgba(59,130,246,0.4); z-index: 10; }
.status-stories { display: flex; gap: 12px; padding: 16px; overflow-x: auto; }
.story { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; }
.story-avatar { width: 64px; height: 64px; border-radius: 50%; border: 3px solid #3b82f6; padding: 2px; }
.story-avatar img, .story-avatar div { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #1e40af; display: flex; align-items: center; justify-content: center; }
.auth { padding: 60px 32px; display: flex; flex-direction: column; gap: 20px; justify-content: center; align-items: center; }
.auth h2 { font-size: 32px; font-weight: 700; color: #60a5fa; margin-bottom: 10px; }
.auth input { width: 100%; max-width: 320px; padding: 18px 20px; background: rgba(255,255,255,0.08); border: 1px solid rgba(96, 165, 250, 0.3); border-radius: 16px; color: #fff; font-size: 16px; outline: none; }
.auth button { width: 100%; max-width: 320px; padding: 18px; background: linear-gradient(135deg, #3b82f6, #1d4ed8); border: none; border-radius: 16px; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; }
.toggle { text-align: center; margin-top: 16px; color: rgba(255,255,255,0.7); cursor: pointer; font-size: 14px; }
.chat-screen { display: flex; flex-direction: column; height: 100%; }
.chat-header { background: rgba(30, 64, 175, 0.3); padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
.messages { flex: 1; overflow-y: auto; padding: 16px 12px; display: flex; flex-direction: column; gap: 8px; }
.msg { max-width: 75%; padding: 10px 14px; border-radius: 18px; position: relative; }
.msg.sent { align-self: flex-end; background: rgba(59, 130, 246, 0.45); }
.msg.received { align-self: flex-start; background: rgba(255,255,255,0.1); }
.input-area { display: flex; padding: 10px 12px; gap: 8px; background: rgba(30, 64, 175, 0.25); }
.input-area input { flex: 1; padding: 12px 16px; background: rgba(255,255,255,0.1); border: 1px solid rgba(96, 165, 250, 0.25); border-radius: 24px; color: #fff; outline: none; }
.ira-btn { position: fixed; bottom: 90px; right: 20px; background: linear-gradient(135deg, #3b82f6, #1d4ed8); width: 50px; height: 50px; border-radius: 50%; display: none; align-items: center; justify-content: center; font-weight: 700; cursor: pointer; z-index: 11; }
.call-overlay, .lock-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; z-index: 100; align-items: center; justify-content: center; flex-direction: column; }
.call-overlay.active, .lock-overlay.active { display: flex; }
.call-videos { display: flex; gap: 10px; width: 90%; }
.call-videos video { width: 45%; border-radius: 12px; background: #000; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1 id="headerTitle">SyncChat</h1>
    <div style="display:flex;align-items:center;gap:8px;">
      <div id="userInfo" style="font-size:13px;opacity:0.8;"></div>
      <label style="cursor:pointer;background:rgba(59,130,246,0.3);padding:6px 10px;border-radius:8px;font-size:12px;">DP<input type="file" id="dpInput" accept="image/*" style="display:none;" onchange="uploadDP(event)"></label>
    </div>
  </div>

  <div id="authScreen" class="screen active">
    <div class="auth">
      <h2 id="authTitle" style="text-align:center;font-size:26px;margin-bottom:10px;">Login</h2>
      <input type="text" id="username" placeholder="Username">
      <input type="password" id="password" placeholder="Password">
      <div class="error" id="authError" style="color:#f87171;text-align:center;font-size:13px;"></div>
      <button onclick="handleAuth()">Continue</button>
      <div class="toggle" onclick="toggleAuth()" style="text-align:center;margin-top:10px;opacity:0.7;cursor:pointer;">Create new account</div>
    </div>
  </div>

  <div id="chatsScreen" class="screen">
    <div class="search-bar">Search or ask Ira</div>
    <div class="filters">
      <div class="filter active">All</div>
      <div class="filter">Unread</div>
      <div class="filter">Favourites</div>
      <div class="filter">Groups</div>
    </div>
    <div class="chats" id="chatsList"></div>
  </div>

  <div id="updatesScreen" class="screen">
    <div style="padding:16px;font-size:18px;font-weight:600;">Status</div>
    <div class="status-stories" id="statusStories"></div>
    <div style="padding:16px;font-size:18px;font-weight:600;">Channels</div>
    <div style="padding:0 16px;color:rgba(255,255,255,0.6);">Coming soon</div>
  </div>

  <div id="communitiesScreen" class="screen">
    <div style="padding:20px;text-align:center;color:rgba(255,255,255,0.6);">Communities coming soon</div>
  </div>

  <div id="callsScreen" class="screen">
    <div style="padding:16px;font-size:18px;font-weight:600;">Recent</div>
    <div id="callsList" class="chats"></div>
  </div>

  <div id="chatScreen" class="screen">
    <div class="chat-header">
      <button class="back-btn" onclick="backToChats()" style="background:none;border:none;color:#fff;font-size:20px;">←</button>
      <div class="avatar" id="chatAvatar"></div>
      <div style="flex:1;">
        <h3 id="chatName"></h3>
        <p id="chatStatus" style="font-size:12px;opacity:0.7;">offline</p>
      </div>
      <button onclick="startCall()" style="background:none;border:none;color:#60a5fa;font-size:18px;">Call</button>
    </div>
    <div class="typing" id="typingIndicator" style="padding:4px 16px;font-size:12px;opacity:0.7;"></div>
    <div class="messages" id="messages"></div>
    <div class="input-area">
      <input type="text" id="msgInput" placeholder="Message" oninput="handleTyping()" onkeypress="if(event.key==='Enter')sendMessage()">
      <button onclick="sendMessage()" style="background:linear-gradient(135deg,#3b82f6,#1d4ed8);border:none;border-radius:50%;width:40px;height:40px;color:white;">→</button>
    </div>
  </div>

  <div class="bottom-nav">
    <div class="nav-item active" onclick="showScreen('chats')"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>Chats</div>
    <div class="nav-item" onclick="showScreen('updates')"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>Updates</div>
    <div class="nav-item" onclick="showScreen('communities')"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>Communities</div>
    <div class="nav-item" onclick="showScreen('calls')"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>Calls</div>
  </div>
</div>

<div class="ira-btn" onclick="toggleIra()">AI</div>
<div class="fab" onclick="alert('New chat / status')">+</div>

<div class="call-overlay" id="callOverlay">
  <div class="call-videos">
    <video id="localVideo" autoplay muted playsinline></video>
    <video id="remoteVideo" autoplay playsinline></video>
  </div>
  <div style="margin-top:20px;display:flex;gap:12px;">
    <button onclick="endCall()" style="padding:12px 24px;background:#ef4444;border:none;border-radius:10px;color:#fff;">End</button>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBZQvkwNm-bWWUKjJfv1luAryOWHW8SXSU",
  authDomain: "syncchat-db031.firebaseapp.com",
  databaseURL: "https://syncchat-db031-default-rtdb.firebaseio.com",
  projectId: "syncchat-db031",
  storageBucket: "syncchat-db031.firebasestorage.app",
  messagingSenderId: "201504868524",
  appId: "1:201504868524:web:f5cbfc84c6341b4c433709"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

let currentUser = null, currentUsername = null, currentChatUid = null, currentChatUsername = null;
let isRegister = false, messagesRef = null, presenceRef = null;

function toggleAuth() {
  isRegister = !isRegister;
  document.getElementById('authTitle').textContent = isRegister ? 'Register' : 'Login';
  document.querySelector('.auth button').textContent = isRegister ? 'Create Account' : 'Continue';
  document.querySelector('.toggle').textContent = isRegister ? 'Already have account? Login' : 'Create new account';
}

async function handleAuth() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const errorEl = document.getElementById('authError');
  errorEl.textContent = '';
  if (!username || !password) return errorEl.textContent = 'Fill all fields';
  const email = username.toLowerCase() + '@syncchat.app';
  try {
    if (isRegister) {
      const snap = await db.ref('usernames/' + username).once('value');
      if (snap.exists()) return errorEl.textContent = 'Username taken';
      const cred = await auth.createUserWithEmailAndPassword(email, password);
      await db.ref('users/' + cred.user.uid).set({ username, email, created: Date.now() });
      await db.ref('usernames/' + username).set(cred.user.uid);
    } else {
      await auth.signInWithEmailAndPassword(email, password);
    }
  } catch (err) {
    errorEl.textContent = err.message.replace('Firebase: ', '').replace(/\(.*\)/, '');
  }
}

async function uploadDP(e) {
  const file = e.target.files[0];
  if (!file || !currentUser) return;
  const reader = new FileReader();
  reader.onload = async () => {
    await db.ref('users/' + currentUser.uid + '/photo').set(reader.result);
    alert('DP updated');
    loadChats();
  };
  reader.readAsDataURL(file);
}

auth.onAuthStateChanged(async (user) => {
  if (user) {
    currentUser = user;
    const snap = await db.ref('users/' + user.uid).once('value');
    currentUsername = snap.val()?.username || 'User';
    document.getElementById('userInfo').textContent = currentUsername;
    setOnline();
    showScreen('chats');
    loadChats();
    listenIncomingCalls();
  } else {
    currentUser = null;
    showScreen('auth');
  }
});

function listenIncomingCalls() {
  db.ref('calls/' + currentUser.uid).on('value', async snap => {
    const data = snap.val();
    if (data && data.type === 'offer' && !peerConnection) {
      if (confirm(data.fromUsername + ' is calling. Accept?')) {
        currentChatUid = data.from;
        currentChatUsername = data.fromUsername;
        await answerCall(data);
      } else {
        db.ref('calls/' + currentUser.uid).remove();
      }
    }
  });
}

async function answerCall(data) {
  try {
    document.getElementById('callOverlay').classList.add('active');
    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    document.getElementById('localVideo').srcObject = localStream;
    const servers = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
    peerConnection = new RTCPeerConnection(servers);
    localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
    peerConnection.ontrack = e => document.getElementById('remoteVideo').srcObject = e.streams[0];
    peerConnection.onicecandidate = e => {
      if (e.candidate) db.ref('calls/' + data.from + '/candidates').push(e.candidate.toJSON());
    };
    await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
    const answer = await peerConnection.createAnswer();
    await peerConnection.setLocalDescription(answer);
    await db.ref('calls/' + data.from + '/answer').set(answer);
    db.ref('calls/' + currentUser.uid + '/candidates').on('child_added', async snap => {
      if (peerConnection) await peerConnection.addIceCandidate(new RTCIceCandidate(snap.val()));
    });
  } catch (err) {
    alert('Failed to answer call');
    endCall();
  }
}

function setOnline() {
  presenceRef = db.ref('presence/' + currentUser.uid);
  presenceRef.set({ online: true, lastSeen: Date.now() });
  presenceRef.onDisconnect().set({ online: false, lastSeen: Date.now() });
}

function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  const iraBtn = document.querySelector('.ira-btn');
  const bottomNav = document.querySelector('.bottom-nav');
  const fab = document.querySelector('.fab');
  if (name === 'auth') {
    document.getElementById('authScreen').classList.add('active');
    iraBtn.style.display = 'none';
    bottomNav.style.display = 'none';
    fab.style.display = 'none';
    return;
  }
  iraBtn.style.display = 'flex';
  bottomNav.style.display = 'flex';
  fab.style.display = 'flex';
  if (name === 'chats') { document.getElementById('chatsScreen').classList.add('active'); document.querySelectorAll('.nav-item')[0].classList.add('active'); loadChats(); }
  if (name === 'updates') { document.getElementById('updatesScreen').classList.add('active'); document.querySelectorAll('.nav-item')[1].classList.add('active'); loadStatusStories(); }
  if (name === 'communities') { document.getElementById('communitiesScreen').classList.add('active'); document.querySelectorAll('.nav-item')[2].classList.add('active'); }
  if (name === 'calls') { document.getElementById('callsScreen').classList.add('active'); document.querySelectorAll('.nav-item')[3].classList.add('active'); }
  if (name === 'chat') document.getElementById('chatScreen').classList.add('active');
  document.getElementById('headerTitle').textContent = name === 'chat' ? currentChatUsername : 'SyncChat';
}

async function loadChats() {
  const list = document.getElementById('chatsList');
  list.innerHTML = '';
  const usersSnap = await db.ref('users').once('value');
  const users = usersSnap.val() || {};
  const others = Object.entries(users).filter(([uid]) => uid !== currentUser.uid);
  if (!others.length) return list.innerHTML = '<div style="text-align:center;padding:40px;opacity:0.6;">No chats yet</div>';
  for (const [uid, data] of others) {
    const chatId = [currentUser.uid, uid].sort().join('_');
    const msgSnap = await db.ref('messages/' + chatId).limitToLast(1).once('value');
    const last = msgSnap.val() ? Object.values(msgSnap.val())[0] : null;
    const div = document.createElement('div');
    div.className = 'chat-item';
    const photo = data.photo ? `<img src="${data.photo}" style="width:100%;height:100%;object-fit:cover;">` : (data.username||'?')[0].toUpperCase();
    div.innerHTML = `<div class="avatar">${photo}</div><div class="chat-info"><h3>${data.username||'User'}</h3><p>${last ? last.text : 'No messages'}</p></div><div class="time">${last ? new Date(last.time).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) : ''}</div>`;
    div.onclick = () => openChat(uid, data.username);
    list.appendChild(div);
  }
}

function openChat(uid, username) {
  currentChatUid = uid;
  currentChatUsername = username;
  document.getElementById('chatName').textContent = username;
  db.ref('users/' + uid + '/photo').once('value', snap => {
    const el = document.getElementById('chatAvatar');
    el.innerHTML = snap.val() ? `<img src="${snap.val()}" style="width:100%;height:100%;object-fit:cover;">` : username[0].toUpperCase();
  });
  showScreen('chat');
  loadMessages();
}

function backToChats() { currentChatUid = null; showScreen('chats'); }

function loadMessages() {
  const chatId = [currentUser.uid, currentChatUid].sort().join('_');
  const container = document.getElementById('messages');
  container.innerHTML = '';
  if (messagesRef) messagesRef.off();
  messagesRef = db.ref('messages/' + chatId);
  messagesRef.on('child_added', snap => {
    const m = snap.val();
    if (m.deleted) return;
    const div = document.createElement('div');
    div.className = 'msg ' + (m.from === currentUser.uid ? 'sent' : 'received');
    div.textContent = m.text;
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
  });
}

function sendMessage() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text || !currentChatUid) return;
  const chatId = [currentUser.uid, currentChatUid].sort().join('_');
  db.ref('messages/' + chatId).push({ from: currentUser.uid, text, time: Date.now() });
  input.value = '';
}

function handleTyping() {}

async function loadStatusStories() {
  const container = document.getElementById('statusStories');
  container.innerHTML = '<div class="story"><div class="story-avatar"><div>+</div></div><span style="font-size:12px;">My status</span></div>';
  const snap = await db.ref('statuses').once('value');
  Object.entries(snap.val() || {}).forEach(([uid, data]) => {
    if (uid === currentUser.uid) return;
    const div = document.createElement('div');
    div.className = 'story';
    div.innerHTML = `<div class="story-avatar"><div>${(data.username||'?')[0]}</div></div><span style="font-size:12px;">${data.username||'User'}</span>`;
    container.appendChild(div);
  });
}

let localStream = null, peerConnection = null, callRef = null;

function startCall() {
  if (!currentChatUid) return alert('Open a chat first');
  alert('Starting call... (Allow camera & mic)');
  initiateCall();
}

async function initiateCall() {
  try {
    document.getElementById('callOverlay').classList.add('active');
    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    document.getElementById('localVideo').srcObject = localStream;
    const servers = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
    peerConnection = new RTCPeerConnection(servers);
    localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
    peerConnection.ontrack = e => document.getElementById('remoteVideo').srcObject = e.streams[0];
    peerConnection.onicecandidate = e => {
      if (e.candidate) db.ref('calls/' + currentChatUid + '/candidates').push(e.candidate.toJSON());
    };
    const offer = await peerConnection.createOffer();
    await peerConnection.setLocalDescription(offer);
    callRef = db.ref('calls/' + currentChatUid);
    await callRef.set({ type: 'offer', offer, from: currentUser.uid, fromUsername: currentUsername });
    callRef.child('answer').on('value', async snap => {
      const answer = snap.val();
      if (answer && !peerConnection.currentRemoteDescription) {
        await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
      }
    });
    db.ref('calls/' + currentUser.uid + '/candidates').on('child_added', async snap => {
      if (peerConnection) await peerConnection.addIceCandidate(new RTCIceCandidate(snap.val()));
    });
  } catch (err) {
    alert('Call failed. Check permissions or network.');
    endCall();
  }
}

function endCall() {
  if (localStream) localStream.getTracks().forEach(t => t.stop());
  if (peerConnection) peerConnection.close();
  peerConnection = null;
  localStream = null;
  document.getElementById('callOverlay').classList.remove('active');
  if (callRef) callRef.remove();
}
