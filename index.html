<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SyncChat</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family: system-ui, -apple-system, sans-serif; }
body { background: linear-gradient(135deg, #0a1628, #1e3a8a, #1e40af); min-height: 100vh; display: flex; justify-content: center; align-items: center; color: #fff; }
.auth input, .status-box input, .input-area input, .ira-input input, .lock-box input { background: rgba(255,255,255,0.1); border: 1px solid rgba(96, 165, 250, 0.3); }
.auth button, .status-box button { background: rgba(59, 130, 246, 0.35); border: 1px solid rgba(96, 165, 250, 0.4); }
.chat-item, .status-item { background: rgba(255,255,255,0.08); border: 1px solid rgba(96, 165, 250, 0.2); }
.msg.sent { background: rgba(59, 130, 246, 0.4); border: 1px solid rgba(59, 130, 246, 0.5); }
.bottom-nav, .chat-header, .input-area, .ira-header { background: rgba(30, 64, 175, 0.25); border-color: rgba(96, 165, 250, 0.25); }
.header h1 { font-size: 20px; font-weight: 600; }
.screen { flex: 1; display: none; flex-direction: column; overflow: hidden; }
.screen.active { display: flex; }
.auth { padding: 40px 28px; display: flex; flex-direction: column; gap: 16px; justify-content: center; }
.auth h2 { text-align: center; font-size: 28px; font-weight: 600; }
.auth input { width: 100%; padding: 16px; background: rgba(255,255,255,0.1); border: 1px solid rgba(96, 165, 250, 0.3); border-radius: 14px; color: #fff; outline: none; }
.auth button { width: 100%; padding: 16px; background: rgba(59, 130, 246, 0.35); border: 1px solid rgba(96, 165, 250, 0.4); border-radius: 14px; color: #fff; font-weight: 600; cursor: pointer; }
.toggle { text-align: center; margin-top: 12px; color: rgba(255,255,255,0.7); cursor: pointer; }
.chats { flex: 1; overflow-y: auto; padding: 8px 0; }
.chat-item { display: flex; align-items: center; padding: 14px 18px; margin: 6px 12px; background: rgba(255,255,255,0.08); border: 1px solid rgba(96, 165, 250, 0.2); border-radius: 16px; cursor: pointer; }
.avatar { width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, #3b82f6, #1d4ed8); display: flex; align-items: center; justify-content: center; font-weight: 600; margin-right: 14px; position: relative; overflow: hidden; }
.online-dot { position: absolute; bottom: 2px; right: 2px; width: 12px; height: 12px; background: #22c55e; border-radius: 50%; border: 2px solid #1e3a8a; }
.chat-info { flex: 1; }
.chat-info h3 { font-size: 16px; }
.chat-info p { font-size: 13px; color: rgba(255,255,255,0.65); }
.bottom-nav { display: flex; background: rgba(30, 64, 175, 0.25); border-top: 1px solid rgba(96, 165, 250, 0.25); }
.bottom-nav button { flex: 1; padding: 14px; background: none; border: none; color: rgba(255,255,255,0.6); cursor: pointer; }
.bottom-nav button.active { color: #fff; }
.chat-screen { display: flex; flex-direction: column; height: 100%; }
.chat-header { background: rgba(30, 64, 175, 0.25); padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
.back-btn, .call-btn { background: rgba(59, 130, 246, 0.25); border: 1px solid rgba(96, 165, 250, 0.3); color: #fff; width: 36px; height: 36px; border-radius: 10px; cursor: pointer; }
.messages { flex: 1; overflow-y: auto; padding: 16px 12px; display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 78%; padding: 10px 14px; border-radius: 16px; position: relative; }
.msg.sent { align-self: flex-end; background: rgba(59, 130, 246, 0.4); border: 1px solid rgba(59, 130, 246, 0.5); }
.msg.received { align-self: flex-start; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15); }
.msg-meta { font-size: 11px; color: rgba(255,255,255,0.6); text-align: right; margin-top: 4px; }
.input-area { display: flex; padding: 12px; gap: 10px; background: rgba(30, 64, 175, 0.2); }
.input-area input { flex: 1; padding: 14px; background: rgba(255,255,255,0.1); border: 1px solid rgba(96, 165, 250, 0.3); border-radius: 22px; color: #fff; outline: none; }
.input-area button { background: linear-gradient(135deg, #3b82f6, #1d4ed8); border: none; border-radius: 50%; width: 44px; height: 44px; color: white; cursor: pointer; }
.typing { font-size: 12px; color: rgba(255,255,255,0.6); padding: 4px 16px; }
.status-box { padding: 20px; }
.status-box input { width: 100%; padding: 14px; background: rgba(255,255,255,0.1); border: 1px solid rgba(96, 165, 250, 0.3); border-radius: 14px; color: #fff; margin-top: 8px; }
.status-box button { margin-top: 12px; padding: 12px 24px; background: rgba(59, 130, 246, 0.35); border: 1px solid rgba(96, 165, 250, 0.4); border-radius: 12px; color: #fff; cursor: pointer; }
.status-item { margin: 8px 16px; padding: 16px; background: rgba(255,255,255,0.08); border-radius: 16px; }
.ira-btn { position: fixed; bottom: 80px; right: 24px; background: linear-gradient(135deg, #3b82f6, #1d4ed8); width: 54px; height: 54px; border-radius: 50%; display: none; align-items: center; justify-content: center; font-weight: 700; cursor: pointer; z-index: 10; border: 1px solid rgba(96, 165, 250, 0.4); }
.ira-panel { position: fixed; bottom: 90px; right: 16px; width: 340px; height: 480px; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(24px); border: 1px solid rgba(96, 165, 250, 0.3); border-radius: 20px; display: none; flex-direction: column; z-index: 20; }
.ira-panel.open { display: flex; }
.ira-header { padding: 14px 16px; display: flex; justify-content: space-between; background: rgba(30, 64, 175, 0.3); }
.ira-messages { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.ira-input { display: flex; padding: 12px; gap: 8px; }
.ira-input input { flex: 1; padding: 12px; background: rgba(255,255,255,0.1); border: 1px solid rgba(96, 165, 250, 0.3); border-radius: 20px; color: #fff; outline: none; }
.ira-input button { background: linear-gradient(135deg, #3b82f6, #1d4ed8); border: none; border-radius: 50%; width: 40px; height: 40px; color: white; cursor: pointer; }
.empty { text-align: center; color: rgba(255,255,255,0.6); margin-top: 60px; }
.error { color: #f87171; font-size: 13px; text-align: center; }
.msg-actions { display: none; position: absolute; top: -32px; right: 0; background: rgba(0,0,0,0.7); border-radius: 8px; padding: 4px 6px; font-size: 11px; gap: 4px; }
.msg:hover .msg-actions { display: flex; }
.reaction { font-size: 12px; margin-top: 2px; }
.call-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
.call-overlay.active { display: flex; }
.call-videos { display: flex; gap: 10px; width: 90%; max-width: 800px; }
.call-videos video { width: 45%; border-radius: 12px; background: #000; }
.call-controls { margin-top: 20px; display: flex; gap: 12px; }
.call-controls button { padding: 12px 20px; background: rgba(59, 130, 246, 0.4); border: none; border-radius: 10px; color: #fff; cursor: pointer; }
.lock-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 90; }
.lock-overlay.active { display: flex; }
.lock-box { background: rgba(30, 64, 175, 0.3); padding: 30px; border-radius: 16px; text-align: center; }
.lock-box input { padding: 12px; margin: 10px 0; background: rgba(255,255,255,0.1); border: 1px solid rgba(96, 165, 250, 0.3); border-radius: 8px; color: #fff; width: 200px; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1 id="headerTitle">SyncChat</h1>
    <div style="display:flex; align-items:center; gap:10px;">
      <div id="userInfo"></div>
      <label style="cursor:pointer; background:rgba(59,130,246,0.35); padding:6px 10px; border-radius:8px; font-size:12px;">
        DP
        <input type="file" id="dpInput" accept="image/*" style="display:none;" onchange="uploadDP(event)">
      </label>
    </div>
  </div>

  <div id="authScreen" class="screen active">
    <div class="auth">
      <h2 id="authTitle">Login</h2>
      <input type="text" id="username" placeholder="Username" autocomplete="off">
      <input type="password" id="password" placeholder="Password" autocomplete="off">
      <div class="error" id="authError"></div>
      <button onclick="handleAuth()">Continue</button>
      <div class="toggle" onclick="toggleAuth()">Create new account</div>
    </div>
  </div>

  <div id="chatsScreen" class="screen">
    <div class="chats" id="chatsList"></div>
    <div class="bottom-nav">
      <button class="active" onclick="showScreen('chats')">Chats</button>
      <button onclick="showScreen('status')">Status</button>
      <button onclick="logout()">Logout</button>
    </div>
  </div>

  <div id="statusScreen" class="screen">
    <div class="status-box">
      <h3>My Status</h3>
      <input type="text" id="myStatus" placeholder="Share your status">
      <button onclick="updateStatus()">Update</button>
    </div>
    <div id="statusesList" style="flex:1; overflow-y:auto;"></div>
    <div class="bottom-nav">
      <button onclick="showScreen('chats')">Chats</button>
      <button class="active" onclick="showScreen('status')">Status</button>
      <button onclick="logout()">Logout</button>
    </div>
  </div>

  <div id="chatScreen" class="screen">
    <div class="chat-header">
      <button class="back-btn" onclick="backToChats()">←</button>
      <div class="avatar" id="chatAvatar"></div>
      <div style="flex:1;">
        <h3 id="chatName"></h3>
        <p id="chatStatus" style="font-size:12px; color:rgba(255,255,255,0.6);">offline</p>
      </div>
      <button class="call-btn" onclick="startCall()">Call</button>
      <button class="call-btn" onclick="toggleLock()">Lock</button>
      <button class="call-btn" onclick="exportChat()">Backup</button>
    </div>
    <div class="typing" id="typingIndicator"></div>
    <div class="messages" id="messages"></div>
    <div class="input-area">
      <input type="text" id="msgInput" placeholder="Message" oninput="handleTyping()" onkeypress="if(event.key==='Enter') sendMessage()">
      <button onclick="sendMessage()">→</button>
    </div>
  </div>
</div>

<div class="ira-btn" onclick="toggleIra()">AI</div>
<div class="ira-panel" id="iraPanel">
  <div class="ira-header"><span>Ira</span><span onclick="toggleIra()">×</span></div>
  <div class="ira-messages" id="iraMessages"></div>
  <div class="ira-input">
    <input type="text" id="iraInput" placeholder="Ask Ira" onkeypress="if(event.key==='Enter') askIra()">
    <button onclick="askIra()">→</button>
  </div>
</div>

<div class="call-overlay" id="callOverlay">
  <div class="call-videos">
    <video id="localVideo" autoplay muted playsinline></video>
    <video id="remoteVideo" autoplay playsinline></video>
  </div>
  <div class="call-controls">
    <button onclick="toggleScreenShare()">Screen</button>
    <button onclick="endCall()">End</button>
  </div>
</div>

<div class="lock-overlay" id="lockOverlay">
  <div class="lock-box">
    <h3>Chat Locked</h3>
    <input type="password" id="lockPin" placeholder="Enter PIN">
    <button onclick="unlockChat()">Unlock</button>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBZQvkwNm-bWWUKjJfv1luAryOWHW8SXSU",
  authDomain: "syncchat-db031.firebaseapp.com",
  databaseURL: "https://syncchat-db031-default-rtdb.firebaseio.com",
  projectId: "syncchat-db031",
  storageBucket: "syncchat-db031.firebasestorage.app",
  messagingSenderId: "201504868524",
  appId: "1:201504868524:web:f5cbfc84c6341b4c433709",
  measurementId: "G-X6NEKHK10N"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

let currentUser = null, currentUsername = null, currentChatUid = null, currentChatUsername = null;
let isRegister = false, messagesRef = null, typingTimeout = null, presenceRef = null;
let localStream = null, peerConnection = null, callRef = null, isScreenSharing = false;
let replyToText = null;

function toggleAuth() {
  isRegister = !isRegister;
  document.getElementById('authTitle').textContent = isRegister ? 'Register' : 'Login';
  document.querySelector('.auth button').textContent = isRegister ? 'Create Account' : 'Continue';
  document.querySelector('.toggle').textContent = isRegister ? 'Already have account? Login' : 'Create new account';
  document.getElementById('authError').textContent = '';
}

async function handleAuth() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const errorEl = document.getElementById('authError');
  errorEl.textContent = '';
  if (!username || !password) return errorEl.textContent = 'Fill all fields';
  const email = username.toLowerCase() + '@syncchat.app';
  try {
    if (isRegister) {
      const snap = await db.ref('usernames/' + username).once('value');
      if (snap.exists()) return errorEl.textContent = 'Username already taken';
      const cred = await auth.createUserWithEmailAndPassword(email, password);
      await db.ref('users/' + cred.user.uid).set({ username, email, created: Date.now() });
      await db.ref('usernames/' + username).set(cred.user.uid);
      await db.ref('statuses/' + cred.user.uid).set({ text: 'Hello from SyncChat', username, time: Date.now() });
    } else {
      await auth.signInWithEmailAndPassword(email, password);
    }
  } catch (err) {
    errorEl.textContent = err.message.replace('Firebase: ', '').replace(/\(.*\)/, '');
  }
}

async function uploadDP(e) {
  const file = e.target.files[0];
  if (!file || !currentUser) return;
  if (file.size > 500000) return alert('Image too large. Choose smaller photo.');
  const reader = new FileReader();
  reader.onload = async () => {
    try {
      await db.ref('users/' + currentUser.uid + '/photo').set(reader.result);
      alert('DP updated');
      loadChats();
    } catch (err) {
      alert('Failed to update DP');
    }
  };
  reader.readAsDataURL(file);
}

function logout() { auth.signOut(); }

auth.onAuthStateChanged(async (user) => {
  if (user) {
    currentUser = user;
    const snap = await db.ref('users/' + user.uid).once('value');
    currentUsername = snap.val()?.username || user.email;
    document.getElementById('userInfo').textContent = currentUsername;
    setOnline();
    showScreen('chats');
    loadChats();
    listenIncomingCalls();
  } else {
    currentUser = null;
    if (presenceRef) presenceRef.remove();
    showScreen('auth');
  }
});

function setOnline() {
  presenceRef = db.ref('presence/' + currentUser.uid);
  presenceRef.set({ online: true, lastSeen: Date.now(), username: currentUsername });
  presenceRef.onDisconnect().set({ online: false, lastSeen: Date.now(), username: currentUsername });
}

function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const iraBtn = document.querySelector('.ira-btn');
  if (name === 'auth') {
    document.getElementById('authScreen').classList.add('active');
    iraBtn.style.display = 'none';
  }
  if (name === 'chats') {
    document.getElementById('chatsScreen').classList.add('active');
    iraBtn.style.display = 'flex';
    loadChats();
  }
  if (name === 'status') {
    document.getElementById('statusScreen').classList.add('active');
    loadStatuses();
    iraBtn.style.display = 'flex';
  }
  if (name === 'chat') {
    document.getElementById('chatScreen').classList.add('active');
    iraBtn.style.display = 'flex';
  }
  document.getElementById('headerTitle').textContent = name === 'chat' ? currentChatUsername : 'SyncChat';
}

async function loadChats() {
  const list = document.getElementById('chatsList');
  list.innerHTML = '<div class="empty">Loading...</div>';
  const usersSnap = await db.ref('users').once('value');
  const users = usersSnap.val() || {};
  list.innerHTML = '';
  const others = Object.entries(users).filter(([uid]) => uid !== currentUser.uid);
  if (!others.length) return list.innerHTML = '<div class="empty">No other users yet.</div>';
  for (const [uid, data] of others) {
    const chatId = [currentUser.uid, uid].sort().join('_');
    const msgSnap = await db.ref('messages/' + chatId).limitToLast(1).once('value');
    const lastMsg = msgSnap.val() ? Object.values(msgSnap.val())[0].text : 'No messages';
    const presenceSnap = await db.ref('presence/' + uid).once('value');
    const isOnline = presenceSnap.val()?.online;
    const div = document.createElement('div');
    div.className = 'chat-item';
    const photoHtml = data.photo ? '<img src="'+data.photo+'" style="width:100%;height:100%;object-fit:cover;">' : (data.username||'?')[0].toUpperCase();
    div.innerHTML = `<div class="avatar">${photoHtml}${isOnline?'<span class="online-dot"></span>':''}</div><div class="chat-info"><h3>${data.username||'User'}</h3><p>${lastMsg}</p></div>`;
    div.onclick = () => openChat(uid, data.username);
    list.appendChild(div);
  }
}

function openChat(uid, username) {
  currentChatUid = uid;
  currentChatUsername = username;
  document.getElementById('chatName').textContent = username;
  db.ref('users/' + uid + '/photo').once('value', snap => {
    const photo = snap.val();
    const avatarEl = document.getElementById('chatAvatar');
    if (photo) {
      avatarEl.innerHTML = '<img src="'+photo+'" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">';
    } else {
      avatarEl.textContent = username[0].toUpperCase();
    }
  });
  showScreen('chat');
  listenPresence();
  loadMessages();
}

function listenPresence() {
  db.ref('presence/' + currentChatUid).on('value', snap => {
    const p = snap.val();
    const el = document.getElementById('chatStatus');
    el.textContent = p?.online ? 'online' : (p?.lastSeen ? 'last seen ' + new Date(p.lastSeen).toLocaleTimeString() : 'offline');
  });
  db.ref('typing/' + currentChatUid + '/' + currentUser.uid).on('value', snap => {
    document.getElementById('typingIndicator').textContent = snap.val() ? currentChatUsername + ' is typing...' : '';
  });
}

function backToChats() {
  if (messagesRef) messagesRef.off();
  db.ref('presence/' + currentChatUid).off();
  db.ref('typing/' + currentChatUid + '/' + currentUser.uid).off();
  currentChatUid = null;
  showScreen('chats');
}

function loadMessages() {
  const chatId = [currentUser.uid, currentChatUid].sort().join('_');
  const container = document.getElementById('messages');
  container.innerHTML = '';
  if (messagesRef) messagesRef.off();
  messagesRef = db.ref('messages/' + chatId);
  messagesRef.on('child_added', snap => renderMessage(snap));
  messagesRef.on('child_changed', snap => { const el = document.getElementById('msg-'+snap.key); if(el) el.remove(); renderMessage(snap); });
  messagesRef.on('child_removed', snap => { const el = document.getElementById('msg-'+snap.key); if(el) el.remove(); });
}

function renderMessage(snap) {
  const m = snap.val();
  if (m.deleted) return;
  const container = document.getElementById('messages');
  const div = document.createElement('div');
  div.id = 'msg-' + snap.key;
  div.className = 'msg ' + (m.from === currentUser.uid ? 'sent' : 'received');
  const ticks = m.from === currentUser.uid ? (m.read ? '✓✓' : '✓') : '';
  div.innerHTML = `${m.replyTo ? '<div style="font-size:12px;opacity:0.7;border-left:2px solid #3b82f6;padding-left:6px;margin-bottom:4px;">'+m.replyTo+'</div>' : ''}${m.text}<div class="msg-meta">${ticks}${m.edited?' (edited)':''}</div><div class="reaction">${m.reaction||''}</div>${m.from===currentUser.uid?'<div class="msg-actions"><button onclick="editMessage(\''+snap.key+'\')">Edit</button><button onclick="deleteMessage(\''+snap.key+'\')">Del</button><button onclick="reactMessage(\''+snap.key+'\')">React</button><button onclick="replyMessage(\''+snap.key+'\',\''+(m.text||'').replace(/'/g,"") +'\')">Reply</button></div>':''}`;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
  if (m.from !== currentUser.uid && !m.read) {
    db.ref('messages/'+[currentUser.uid,currentChatUid].sort().join('_')+'/'+snap.key).update({read:true,delivered:true});
  }
}

function sendMessage() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text || !currentChatUid) return;
  const chatId = [currentUser.uid, currentChatUid].sort().join('_');
  db.ref('messages/'+chatId).push({
    from: currentUser.uid,
    fromUsername: currentUsername,
    text,
    time: Date.now(),
    delivered: false,
    read: false,
    replyTo: replyToText || null
  });
  replyToText = null;
  document.getElementById('msgInput').placeholder = 'Message';
  input.value = '';
  clearTyping();
}

function handleTyping() {
  if (!currentChatUid) return;
  db.ref('typing/'+currentUser.uid+'/'+currentChatUid).set(true);
  clearTimeout(typingTimeout);
  typingTimeout = setTimeout(clearTyping, 1500);
}
function clearTyping() { if(currentChatUid) db.ref('typing/'+currentUser.uid+'/'+currentChatUid).set(false); }

function replyMessage(key, text) {
  replyToText = text.substring(0, 50);
  document.getElementById('msgInput').placeholder = 'Reply: ' + replyToText;
  document.getElementById('msgInput').focus();
}

async function reactMessage(key) {
  const reaction = prompt('Reaction:') || 'like';
  const chatId = [currentUser.uid, currentChatUid].sort().join('_');
  await db.ref('messages/'+chatId+'/'+key).update({ reaction });
}

async function editMessage(key) {
  const newText = prompt('Edit message:');
  if (!newText) return;
  const chatId = [currentUser.uid, currentChatUid].sort().join('_');
  await db.ref('messages/'+chatId+'/'+key).update({text:newText,edited:true});
}

async function deleteMessage(key) {
  if (!confirm('Delete?')) return;
  const chatId = [currentUser.uid, currentChatUid].sort().join('_');
  await db.ref('messages/'+chatId+'/'+key).update({deleted:true,text:''});
}

async function loadStatuses() {
  const mySnap = await db.ref('statuses/'+currentUser.uid).once('value');
  document.getElementById('myStatus').value = mySnap.val()?.text || '';
  const list = document.getElementById('statusesList');
  list.innerHTML = '';
  const allSnap = await db.ref('statuses').once('value');
  Object.entries(allSnap.val()||{}).forEach(([uid,data]) => {
    if (uid === currentUser.uid) return;
    const div = document.createElement('div');
    div.className = 'status-item';
    div.innerHTML = `<strong>${data.username||'User'}</strong><p style="color:rgba(255,255,255,0.7);margin-top:6px;">${data.text}</p>`;
    list.appendChild(div);
  });
}

async function updateStatus() {
  const text = document.getElementById('myStatus').value.trim();
  if (!text) return;
  try {
    await db.ref('statuses/'+currentUser.uid).set({text,username:currentUsername,time:Date.now()});
    alert('Status updated');
    loadStatuses();
  } catch (err) {
    alert('Failed to update status');
  }
}

function exportChat() {
  if (!currentChatUid) return;
  const chatId = [currentUser.uid, currentChatUid].sort().join('_');
  db.ref('messages/'+chatId).once('value', snap => {
    const data = JSON.stringify(snap.val() || {}, null, 2);
    const blob = new Blob([data], {type: 'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'syncchat_backup_' + chatId + '.json';
    a.click();
  });
}

const servers = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

function listenIncomingCalls() {
  db.ref('calls/'+currentUser.uid).on('value', async snap => {
    const data = snap.val();
    if (data && data.type === 'offer' && !peerConnection) {
      if (confirm(data.fromUsername + ' is calling. Accept?')) {
        currentChatUid = data.from;
        currentChatUsername = data.fromUsername;
        await answerCall(data);
      }
    }
  });
}

async function startCall() {
  if (!currentChatUid) return alert('Open a chat first');
  try {
    document.getElementById('callOverlay').classList.add('active');
    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    document.getElementById('localVideo').srcObject = localStream;
    peerConnection = new RTCPeerConnection(servers);
    localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
    peerConnection.ontrack = e => document.getElementById('remoteVideo').srcObject = e.streams[0];
    peerConnection.onicecandidate = e => {
      if (e.candidate) db.ref('calls/'+currentChatUid+'/candidates').push(e.candidate.toJSON());
    };
    const offer = await peerConnection.createOffer();
    await peerConnection.setLocalDescription(offer);
    callRef = db.ref('calls/'+currentChatUid);
    await callRef.set({ type: 'offer', offer, from: currentUser.uid, fromUsername: currentUsername });
    callRef.child('answer').on('value', async snap => {
      const answer = snap.val();
      if (answer && !peerConnection.currentRemoteDescription) await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
    });
    db.ref('calls/'+currentUser.uid+'/candidates').on('child_added', async snap => {
      if (peerConnection) await peerConnection.addIceCandidate(new RTCIceCandidate(snap.val()));
    });
  } catch (err) {
    alert('Call failed. Check camera/mic permission or network.');
    endCall();
  }
}

async function answerCall(data) {
  try {
    document.getElementById('callOverlay').classList.add('active');
    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    document.getElementById('localVideo').srcObject = localStream;
    peerConnection = new RTCPeerConnection(servers);
    localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
    peerConnection.ontrack = e => document.getElementById('remoteVideo').srcObject = e.streams[0];
    peerConnection.onicecandidate = e => {
      if (e.candidate) db.ref('calls/'+data.from+'/candidates').push(e.candidate.toJSON());
    };
    await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
    const answer = await peerConnection.createAnswer();
    await peerConnection.setLocalDescription(answer);
    await db.ref('calls/'+data.from+'/answer').set(answer);
    db.ref('calls/'+currentUser.uid+'/candidates').on('child_added', async snap => {
      if (peerConnection) await peerConnection.addIceCandidate(new RTCIceCandidate(snap.val()));
    });
  } catch (err) {
    alert('Failed to answer call');
    endCall();
  }
}

async function toggleScreenShare() {
  if (!peerConnection) return;
  try {
    if (!isScreenSharing) {
      const screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
      const screenTrack = screenStream.getVideoTracks()[0];
      const sender = peerConnection.getSenders().find(s => s.track.kind === 'video');
      if (sender) sender.replaceTrack(screenTrack);
      screenTrack.onended = () => toggleScreenShare();
      isScreenSharing = true;
    } else {
      const camStream = await navigator.mediaDevices.getUserMedia({ video: true });
      const camTrack = camStream.getVideoTracks()[0];
      const sender = peerConnection.getSenders().find(s => s.track.kind === 'video');
      if (sender) sender.replaceTrack(camTrack);
      isScreenSharing = false;
    }
  } catch (err) {
    alert('Screen share failed');
  }
}

function endCall() {
  if (localStream) localStream.getTracks().forEach(t => t.stop());
  if (peerConnection) peerConnection.close();
  peerConnection = null;
  localStream = null;
  isScreenSharing = false;
  document.getElementById('callOverlay').classList.remove('active');
  if (callRef) callRef.remove();
  db.ref('calls/'+currentUser.uid).remove();
}

let chatLocked = false;
let savedPin = localStorage.getItem('syncchat_pin') || '';

function toggleLock() {
  if (!savedPin) {
    const pin = prompt('Set a 4-digit PIN for chat lock:');
    if (pin && pin.length >= 4) {
      savedPin = pin;
      localStorage.setItem('syncchat_pin', pin);
      alert('PIN set');
    }
  }
  chatLocked = true;
  document.getElementById('lockOverlay').classList.add('active');
  document.getElementById('chatScreen').style.filter = 'blur(8px)';
}

function unlockChat() {
  const pin = document.getElementById('lockPin').value;
  if (pin === savedPin) {
    chatLocked = false;
    document.getElementById('lockOverlay').classList.remove('active');
    document.getElementById('chatScreen').style.filter = 'none';
    document.getElementById('lockPin').value = '';
  } else {
    alert('Wrong PIN');
  }
}
